<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Voice & Text Messenger</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #0084ff;
            --text: #e1e1e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 400px;
            background: var(--surface);
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            height: 90vh;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .header {
            padding: 15px;
            background: #252525;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .status {
            font-size: 12px;
            color: #4caf50;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
        }
        .status.offline { color: #f44336; }
        .dot {
            width: 8px;
            height: 8px;
            background: currentColor;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 1; }
            100% { transform: scale(0.95); opacity: 0.5; }
        }
        .volume-control {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px;
            font-size: 12px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
        }
        .volume-control input {
            margin-left: 10px;
            width: 100px;
        }
        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 14px;
            word-wrap: break-word;
        }
        .message.self {
            background: var(--primary);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .message.other {
            background: #333;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        .input-area {
            display: flex;
            padding: 15px;
            background: #252525;
            border-top: 1px solid #333;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px 15px;
            border-radius: 20px;
            border: none;
            background: #333;
            color: white;
            outline: none;
        }
        button {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            cursor: pointer;
            font-weight: bold;
        }
        button:active { background: #006bce; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h3 style="margin: 0 0 5px 0;">Offline Voice Connect</h3>
        <div id="statusText" class="status offline"><div class="dot"></div>Waiting for other tab...</div>
    </div>
    
    <div class="volume-control">
        <span>Speaker Volume: </span>
        <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.5">
    </div>

    <div class="chat-box" id="chatBox">
        <div style="text-align: center; color: #777; font-size: 12px; margin-bottom: 10px;">
            Open this page in a second tab. The microphone is highly sensitive and always on.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Send a fast message..." autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>
</div>

<!-- Hidden audio element for playing incoming voice -->
<audio id="remoteAudio" autoplay></audio>

<script>
    // Audio synthesis for the "send message" sound
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSendSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(600, audioCtx.currentTime);
        oscillator.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2);
    }

    // UI Elements
    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const remoteAudio = document.getElementById('remoteAudio');
    const volumeSlider = document.getElementById('volumeSlider');

    // Volume control
    volumeSlider.addEventListener('input', (e) => {
        remoteAudio.volume = e.target.value;
    });
    remoteAudio.volume = volumeSlider.value;

    function addMessage(text, isSelf) {
        const div = document.createElement('div');
        div.className = `message ${isSelf ? 'self' : 'other'}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // WebRTC Offline Signaling via BroadcastChannel
    const signalingChannel = new BroadcastChannel('offline_messenger_channel');
    let peerConnection;
    let dataChannel;

    const configuration = { iceServers: [] }; // Empty because it's purely local/offline

    async function initializeConnection() {
        peerConnection = new RTCPeerConnection(configuration);

        // Highly sensitive microphone constraints (picks up distant/noisy background sounds)
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false, 
                    noiseSuppression: false, 
                    autoGainControl: true    
                },
                video: false
            });
            stream.getTracks().forEach(track => peerConnection.addTrack(track, stream));
        } catch (err) {
            addMessage("Mic access denied. Voice won't work.", true);
        }

        // Receive remote audio
        peerConnection.ontrack = event => {
            remoteAudio.srcObject = event.streams[0];
        };

        // ICE Candidate handling
        peerConnection.onicecandidate = event => {
            if (event.candidate) {
                signalingChannel.postMessage({ type: 'candidate', candidate: event.candidate });
            }
        };

        // Data Channel for fast text messaging
        peerConnection.ondatachannel = event => {
            const receiveChannel = event.channel;
            receiveChannel.onmessage = e => addMessage(e.data, false);
        };

        peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === 'connected') {
                statusText.className = 'status';
                statusText.innerHTML = '<div class="dot"></div>Connected & Listening';
            }
        };
    }

    async function makeCall() {
        await initializeConnection();
        dataChannel = peerConnection.createDataChannel('chat');
        dataChannel.onmessage = e => addMessage(e.data, false);

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        signalingChannel.postMessage({ type: 'offer', offer: offer });
    }

    // Handle offline signaling messages
    signalingChannel.onmessage = async (event) => {
        const message = event.data;

        if (message.type === 'ping') {
            // Other tab opened, initiate connection
            makeCall();
        }

        if (message.type === 'offer') {
            await initializeConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.offer));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            signalingChannel.postMessage({ type: 'answer', answer: answer });
        }

        if (message.type === 'answer') {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(message.answer));
        }

        if (message.type === 'candidate' && peerConnection) {
            await peerConnection.addIceCandidate(new RTCIceCandidate(message.candidate));
        }
    };

    // Send fast text message
    function sendMessage() {
        const text = msgInput.value.trim();
        if (text) {
            if (dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(text);
            } else if (peerConnection) {
                // Fallback if caller hasn't initiated datachannel, send via signaling for demo robustness
                signalingChannel.postMessage({ type: 'text', text: text });
            }
            addMessage(text, true);
            playSendSound(); // Play the audio blip when sent
            msgInput.value = '';
        }
    }

    // Also accept fallback text messages through signaling channel
    signalingChannel.addEventListener('message', (e) => {
        if (e.data.type === 'text') {
            addMessage(e.data.text, false);
        }
    });

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

    // Start by pinging to see if another tab is already open
    setTimeout(() => {
        signalingChannel.postMessage({ type: 'ping' });
    }, 500);

</script>
</body>
</html>
