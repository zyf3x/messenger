<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Voice Messenger</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        #chat-container {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .message {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 16px;
            line-height: 1.4;
            animation: popIn 0.3s ease-out;
        }

        .message.sent {
            background-color: #0b93f6;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.system {
            background-color: #333333;
            color: #aaaaaa;
            align-self: center;
            font-size: 12px;
            border-radius: 12px;
            text-align: center;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.9) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* Overlay to bypass browser Autoplay/Mic block */
        #start-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        #start-btn {
            padding: 15px 30px;
            font-size: 20px;
            background-color: #0b93f6;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(11, 147, 246, 0.4);
        }

        #status-bar {
            background-color: #1e1e1e;
            padding: 10px;
            text-align: center;
            font-size: 14px;
            color: #00e676;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- Start Overlay for Browser Permissions -->
    <div id="start-overlay">
        <h2 style="margin-bottom: 20px;">Offline Voice Messenger</h2>
        <p style="text-align: center; max-width: 400px; color: #ccc; margin-bottom: 30px;">
            Browsers require you to click once to allow audio playback and microphone access. After this, it will listen automatically.
        </p>
        <button id="start-btn">Click to Initialize Messenger</button>
    </div>

    <!-- Chat UI -->
    <div id="chat-container"></div>
    <div id="status-bar">Waiting to start...</div>

    <script>
        const startOverlay = document.getElementById('start-overlay');
        const startBtn = document.getElementById('start-btn');
        const chatContainer = document.getElementById('chat-container');
        const statusBar = document.getElementById('status-bar');

        let audioCtx;
        let recognition;
        let isListening = false;

        // Play a fast, offline generated "sent" sound using Web Audio API
        function playSendSound() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime); // High pitch pop
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
            // Speaker can be quiet: volume set low to 0.2 out of 1.0
            gainNode.gain.linearRampToValueAtTime(0.2, audioCtx.currentTime + 0.02);
            gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.15);
            
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        }

        function addMessage(text, type = 'sent') {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message', type);
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function initApp() {
            // 1. Initialize Audio Context for Sounds
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();

            // 2. Setup Speech Recognition
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (!SpeechRecognition) {
                alert("Your browser does not support the Web Speech API. Please use Google Chrome.");
                return;
            }

            recognition = new SpeechRecognition();
            
            // Configuration for continuous, fast listening
            recognition.continuous = true;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            // 3. Request highly sensitive microphone access
            // Attempting to maximize capture distance by tweaking constraints
            navigator.mediaDevices.getUserMedia({ 
                audio: { 
                    autoGainControl: true,       // Boosts quiet sounds automatically
                    noiseSuppression: false,     // Don't filter out background noise
                    echoCancellation: false      // Don't filter out room reverb
                } 
            }).then(stream => {
                startOverlay.style.display = 'none';
                statusBar.textContent = "Listening continuously... (Mic active)";
                
                // Start recognition
                recognition.start();
                isListening = true;
                addMessage("Microphone activated. System is always listening.", "system");

            }).catch(err => {
                alert("Microphone permission denied: " + err);
            });

            // Handle successful voice capture
            recognition.onresult = (event) => {
                const current = event.resultIndex;
                const transcript = event.results[current][0].transcript.trim();
                
                if (transcript.length > 0) {
                    addMessage(transcript, 'sent');
                    playSendSound(); // Play quiet notification sound immediately
                }
            };

            // Force restart if it stops (Always Listening feature)
            recognition.onend = () => {
                if (isListening) {
                    try {
                        recognition.start();
                    } catch (e) {
                        // Ignore restart errors
                    }
                }
            };

            recognition.onerror = (event) => {
                if (event.error === 'not-allowed') {
                    isListening = false;
                    statusBar.textContent = "Microphone access blocked.";
                }
                // It will naturally attempt to restart via onend unless blocked
            };
        }

        // Wait for user to click to bypass browser restrictions
        startBtn.addEventListener('click', initApp);
    </script>
</body>
</html>
