<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline Voice & Text Messenger</title>
    <style>
        :root {
            --bg: #121212;
            --surface: #1e1e1e;
            --primary: #0084ff;
            --text: #e1e1e1;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 500px;
            background: var(--surface);
            display: flex;
            flex-direction: column;
            height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .header {
            padding: 15px;
            background: #252525;
            text-align: center;
            border-bottom: 1px solid #333;
        }
        .header h3 { margin: 0 0 5px 0; }
        .status {
            font-size: 14px;
            color: #ff9800;
            font-weight: bold;
        }
        .status.connected { color: #4caf50; }
        
        .setup-area {
            padding: 15px;
            background: #1a1a1a;
            border-bottom: 1px solid #333;
            font-size: 13px;
        }
        .setup-area textarea {
            width: 100%;
            height: 60px;
            background: #000;
            color: #00ff00;
            border: 1px solid #333;
            margin: 5px 0;
            box-sizing: border-box;
            padding: 5px;
        }
        .setup-buttons {
            display: flex;
            gap: 5px;
            margin-top: 5px;
        }
        .setup-buttons button {
            flex: 1;
            padding: 8px;
            background: #333;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .setup-buttons button:active { background: #555; }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            background: #222;
            border-bottom: 1px solid #333;
        }
        .volume-slider { display: flex; align-items: center; gap: 10px; font-size: 14px; }
        .volume-slider input { width: 100px; }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 15px;
            border-radius: 18px;
            font-size: 15px;
            word-wrap: break-word;
        }
        .message.self {
            background: var(--primary);
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .message.other {
            background: #333;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .input-area {
            display: flex;
            padding: 10px;
            background: #252525;
            border-top: 1px solid #333;
        }
        #msgInput {
            flex: 1;
            padding: 12px 15px;
            border-radius: 20px;
            border: none;
            background: #333;
            color: white;
            outline: none;
            font-size: 15px;
        }
        #sendBtn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 18px;
        }
        #sendBtn:active { background: #006bce; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h3>Offline P2P Messenger</h3>
        <div id="statusText" class="status">Microphone Active - Not Connected</div>
    </div>

    <div class="setup-area" id="setupArea">
        <div><strong>Offline Connection:</strong></div>
        <textarea id="sdpData" placeholder="Connection code will appear here, or paste a code here..."></textarea>
        <div class="setup-buttons">
            <button onclick="hostConnection()">1. Host</button>
            <button onclick="joinConnection()">2. Join</button>
            <button onclick="finalizeConnection()">3. Finalize</button>
        </div>
    </div>

    <div class="controls">
        <div class="volume-slider">
            <span>Speaker Vol:</span>
            <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.2">
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div style="text-align: center; color: #777; font-size: 12px;">
            Background listening started automatically. Waiting for connection...
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="msgInput" placeholder="Message..." autocomplete="off">
        <button id="sendBtn">➤</button>
    </div>
</div>

<audio id="remoteAudio" autoplay></audio>

<script>
    // System Elements
    const chatBox = document.getElementById('chatBox');
    const msgInput = document.getElementById('msgInput');
    const sendBtn = document.getElementById('sendBtn');
    const statusText = document.getElementById('statusText');
    const remoteAudio = document.getElementById('remoteAudio');
    const volumeSlider = document.getElementById('volumeSlider');
    const sdpData = document.getElementById('sdpData');
    const setupArea = document.getElementById('setupArea');

    // Volume Control (can be very quiet)
    remoteAudio.volume = volumeSlider.value;
    volumeSlider.addEventListener('input', (e) => {
        remoteAudio.volume = e.target.value;
    });

    // Audio Context for message send sound (Bloop)
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    const audioCtx = new AudioContext();

    function playSendSound() {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    // Chat Functions
    function addMessage(text, isSelf) {
        const div = document.createElement('div');
        div.className = `message ${isSelf ? 'self' : 'other'}`;
        div.textContent = text;
        chatBox.appendChild(div);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    // WEBRTC PEER CONNECTION (OFFLINE P2P)
    let peerConnection;
    let dataChannel;
    let localStream;

    const config = {
        iceServers: [] // No external servers, fully offline local network routing
    };

    // Auto-start Microphone with extreme sensitivity
    async function startAlwaysListening() {
        try {
            // Highly sensitive constraints to capture background and distant noises
            localStream = await navigator.mediaDevices.getUserMedia({
                audio: {
                    echoCancellation: false,
                    noiseSuppression: false,
                    autoGainControl: true,
                    channelCount: 2
                },
                video: false
            });
            console.log("Microphone is constantly listening in the background.");
        } catch (err) {
            addMessage("Microphone blocked! Please allow permissions.", true);
        }
    }

    // Start listening immediately on page load
    window.onload = startAlwaysListening;

    function initPeerConnection() {
        peerConnection = new RTCPeerConnection(config);

        if (localStream) {
            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });
        }

        peerConnection.ontrack = event => {
            remoteAudio.srcObject = event.streams[0];
        };

        peerConnection.onicecandidate = e => {
            // Wait for ICE gathering to complete to generate the offline code
            if (e.candidate === null) {
                const code = btoa(JSON.stringify(peerConnection.localDescription));
                sdpData.value = code;
                sdpData.select();
            }
        };

        peerConnection.onconnectionstatechange = () => {
            if (peerConnection.connectionState === 'connected') {
                statusText.textContent = "Connected & Listening";
                statusText.className = "status connected";
                setupArea.style.display = 'none'; // Hide setup once connected
            }
        };
    }

    function setupDataChannel() {
        dataChannel.onopen = () => console.log("Data channel open");
        dataChannel.onmessage = e => {
            addMessage(e.data, false);
        };
    }

    // Step 1: Host
    async function hostConnection() {
        initPeerConnection();
        dataChannel = peerConnection.createDataChannel('chat');
        setupDataChannel();
        
        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);
        sdpData.value = "Generating host code... Please wait a second.";
    }

    // Step 2: Join
    async function joinConnection() {
        const offerStr = sdpData.value.trim();
        if (!offerStr) return alert("Paste the Host's code first!");
        
        initPeerConnection();
        peerConnection.ondatachannel = event => {
            dataChannel = event.channel;
            setupDataChannel();
        };

        const offer = JSON.parse(atob(offerStr));
        await peerConnection.setRemoteDescription(offer);
        
        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);
        sdpData.value = "Generating join code... Please wait a second.";
    }

    // Step 3: Finalize
    async function finalizeConnection() {
        const answerStr = sdpData.value.trim();
        if (!answerStr) return alert("Paste the Joiner's code first!");
        
        const answer = JSON.parse(atob(answerStr));
        await peerConnection.setRemoteDescription(answer);
    }

    // Sending Messages fast
    function sendMessage() {
        const text = msgInput.value.trim();
        if (text && dataChannel && dataChannel.readyState === 'open') {
            dataChannel.send(text);
            addMessage(text, true);
            playSendSound(); // Play audio when sending
            msgInput.value = '';
        } else if (!dataChannel || dataChannel.readyState !== 'open') {
            alert("Not connected to another phone yet!");
        }
    }

    sendBtn.addEventListener('click', sendMessage);
    msgInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') sendMessage();
    });

</script>
</body>
</html>
